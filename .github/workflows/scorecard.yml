name: Scorecard

# OpenSSF Scorecard: repo güvenlik pratiklerini (branch protection, pinned
# dependencies, token permissions, imzalı sürümler, ...) puanlar.
#
# publish_results: true olduğu için Scorecard API'si bu workflow'a kısıtlar uygular:
# üst seviye env/defaults yok, workflow seviyesinde yazma yetkisi yok, Scorecard
# job'unda env/servis/`run` adımı yok ve yalnızca onaylı Action'lar kullanılabilir
# (checkout, upload-artifact, codeql-action/upload-sarif, scorecard-action).
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # repo içeriğini okumak için
      actions: read # workflow çalışmalarını/ayarlarını değerlendirmek için
      security-events: write # SARIF'i Code Scanning'e yüklemek için (yalnızca bu job)
      id-token: write # sonuçları OIDC ile imzalayıp Scorecard API'sine yayınlamak için (yalnızca bu job)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Yayın API tarafından reddedilirse (ör. workflow kısıtı ihlali) job düşer;
          # varsayılan (false) yalnızca uyarı verip yeşil kalır.
          fail_on_publish_error: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
