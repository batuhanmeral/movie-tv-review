# Tarayıcılar, action yerine digest'e sabitlenmiş resmi imajlarla çalışır. Dependabot
# env'deki imaj satırlarını güncelleyemez; tag ve digest birlikte elle değiştirilir
# (docker buildx imagetools inspect <imaj>:<tag>, en üstteki Digest).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Kod değişmese de yeni CVE ve kurallar çıkar. Aktif olmayan repo: aylık.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
  # release.yml aynı kapıları tag'lenen commit için çağırır.
  workflow_call:

permissions:
  contents: read

# Yalnızca PR'da iptal. Önek, release.yml çağırdığında (github.workflow o zaman
# çağıranın adıdır) grubu benzersiz tutar.
concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af

jobs:
  sast:
    name: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tek çalıştırma: bulgular log'a, SARIF kopyası çalışma dizinine.
      - name: Semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --metrics=off --error
          --severity ERROR --severity WARNING
          --sarif-output=semgrep.sarif
          --config p/typescript --config p/nodejs --config p/expressjs
          --config p/react --config p/dockerfile
      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          # Çevrimiçi denetimler: impostor commit, bilinen zafiyetli action.
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/src:ro" "$ZIZMOR_IMAGE" --min-severity medium /src
      # SARIF, yazma yetkili token'ı tarayıcılardan uzak tutmak için ayrı job'da yüklenir.
      # Fork PR'larında token salt-okur olduğu için atlanır.
      - name: Keep Semgrep SARIF
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 5

  sast-upload:
    name: sast-upload
    needs: sast
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      security-events: write # upload-sarif, Semgrep sonucunu code scanning'e yazar.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: semgrep-sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tüm geçmiş
          persist-credentials: false
      # Depo runner kullanıcısına ait; konteynerdeki git'in reddetmemesi için safe.directory.
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          "$GITLEAKS_IMAGE" git /repo --redact --no-banner -v

  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy (lockfile)
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src -v "$RUNNER_TEMP/trivy:/root/.cache" "$TRIVY_IMAGE"
          fs --scanners vuln --include-dev-deps
          --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 .
      - name: Trivy (Dockerfiles)
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src -v "$RUNNER_TEMP/trivy:/root/.cache" "$TRIVY_IMAGE"
          config --severity CRITICAL,HIGH --exit-code 1 .

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build -f backend/Dockerfile -t movie-tv-review-backend:scan .
          docker build -f frontend/Dockerfile -t movie-tv-review-frontend:scan .
      - name: Trivy (images)
        run: |
          for image in movie-tv-review-backend:scan movie-tv-review-frontend:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy:/root/.cache" "$TRIVY_IMAGE" \
              image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$image"
          done

  # Backend'in üretim imajı, seed'lenmiş geçici Postgres/Redis ile ayağa kaldırılır ve
  # ZAP baseline (yalnızca pasif tarama) ile taranır. security/zap-rules.tsv'deki FAIL
  # kuralları job'ı kırar; -I ile WARN'lar raporda kalır.
  dast:
    name: dast
    # GitHub-hosted (geçici) runner varsayılır: backend ve ZAP --network host ile çalışır.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          # Yalnızca bu job'ın geçici, dışarıya kapalı servis konteyneri; secret değil.
          POSTGRES_USER: zap
          POSTGRES_PASSWORD: zap-ephemeral-ci
          POSTGRES_DB: zap
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U zap -d zap"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://zap:zap-ephemeral-ci@localhost:5432/zap?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter ./backend...
      - name: Migrate and seed the scan database
        run: |
          pnpm --filter ./backend prisma:generate
          pnpm --filter ./backend prisma:deploy
          pnpm --filter ./backend seed
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t zap-target/backend:ci .
      # JWT secret'ları her çalışmada rastgele üretilir ve log'da maskelenir.
      - name: Start backend (production mode, throwaway secrets)
        run: |
          access=$(openssl rand -hex 32); refresh=$(openssl rand -hex 32)
          echo "::add-mask::$access"; echo "::add-mask::$refresh"
          docker run -d --name zap-target --network host \
            -e PORT=4000 -e DATABASE_URL -e REDIS_URL=redis://localhost:6379 \
            -e JWT_ACCESS_SECRET="$access" -e JWT_REFRESH_SECRET="$refresh" \
            -e TMDB_API_KEY=zap-scan-dummy -e CORS_ORIGIN=http://localhost:8080 \
            zap-target/backend:ci
          for _ in $(seq 60); do
            curl -sf http://localhost:4000/api/health/ready > /dev/null && exit 0
            sleep 1
          done
          echo "::error::backend did not become ready"
          docker logs zap-target
          exit 1
      # Backend'in OpenAPI dokümanı yok; spider JSON yanıtlarda link bulamaz.
      # security/zap-hooks.py herkese açık GET uç noktalarını ZAP'e bir kez ziyaret ettirir.
      - name: ZAP baseline
        run: |
          mkdir -p zap && cp security/zap-rules.tsv security/zap-hooks.py zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:4000/api/health \
              -c zap-rules.tsv --hook=/zap/wrk/zap-hooks.py -I \
              -r zap-report.html -J zap-report.json
      - name: Backend logs
        if: failure()
        run: docker logs zap-target || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: zap-report
          path: |
            zap/zap-report.html
            zap/zap-report.json
          if-no-files-found: ignore
          retention-days: 14

  sbom:
    name: sbom
    # PR'da gerek yok; main, schedule ve elle çalıştırmada.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CycloneDX SBOM
        run: >-
          docker run --rm -v "$PWD:/src" -w /src -v "$RUNNER_TEMP/trivy:/root/.cache" "$TRIVY_IMAGE"
          fs --format cyclonedx --output sbom.cdx.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
