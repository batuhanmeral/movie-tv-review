# SPA sunucusu (nginx-unprivileged, root olmayan kullanıcı, port 8080).
#
# Bu imaj yalnızca statik dosyaları sunar. /api ve /uploads backend'e aittir;
# önde bir reverse proxy / ingress bu yolları backend servisine yönlendirmelidir
# (ya da imaj VITE_API_URL ile mutlak bir API adresiyle derlenmelidir).
#
# IPv6 dinleyicisi bilinçli olarak yok: IPv6'sı kapalı host'larda nginx'in
# açılamamasını önler (upstream imaj da bunu yalnızca varsayılan config'te ekler).
server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Konteyner sağlık kontrolü
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend yolları bu imajda yok: SPA fallback'in API çağrılarına index.html
    # (200) dönmesi yerine açık bir 404 verilir.
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"error":"API is not served by the frontend container"}\n';
    }
    location ^~ /uploads/ {
        return 404;
    }

    # Hash'li Vite çıktıları uzun süre önbelleklenebilir
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # İstemci tarafı yönlendirme: bilinmeyen yollar index.html'e düşer
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
