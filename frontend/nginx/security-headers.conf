# Ortak güvenlik başlıkları. nginx'te bir location kendi add_header'ını
# tanımlarsa üst seviyedekiler kalıtılmaz; bu yüzden her location bu dosyayı
# include eder.
#
# CSP: Google Fonts, TMDB/YouTube görselleri ve YouTube embed'leri. API farklı bir
# origin'deyse (__CSP_API_ORIGIN__) imaj derlenirken CSP_API_ORIGIN build arg'ı ile
# eklenir (backend avatarları /uploads üzerinden aynı origin'den gelir).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://image.tmdb.org https://img.youtube.com __CSP_API_ORIGIN__; connect-src 'self' __CSP_API_ORIGIN__; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# HSTS, TLS'in sonlandırıldığı katmanda (reverse proxy / ingress) eklenmelidir.
